services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teacher_admin
      POSTGRES_PASSWORD: teacher_admin
      POSTGRES_DB: teacher_admin
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher_admin -d teacher_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
